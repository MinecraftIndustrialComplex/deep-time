modLoader   = "javafml"
loaderVersion = "${loader_version_range}"
license     = "${mod_license}"

[[mixins]]
config = "deeptime.mixins.json"

# Test-only mixins; the config plugin applies them only with -Ddeeptime.gametest=true.
[[mixins]]
config = "deeptime.gametest.mixins.json"

[[mods]]
modId       = "${mod_id}"
version     = "${mod_version}"
displayName = "${mod_name}"
authors     = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
    modId        = "minecraft"
    type         = "required"
    versionRange = "${minecraft_version_range}"
    ordering     = "NONE"
    side         = "BOTH"

[[dependencies.${mod_id}]]
    modId        = "neoforge"
    type         = "required"
    versionRange = "${neo_version_range}"
    ordering     = "NONE"
    side         = "BOTH"

# The planet wraps east-west through Toroidal World's API (decisions file, "Wrapping").
[[dependencies.${mod_id}]]
    modId        = "toroidal_world"
    type         = "required"
    versionRange = "[0.19.3,)"
    ordering     = "AFTER"
    side         = "BOTH"

# Sable ships get the pole cap's wind (compat/sable/SablePoleCap, P1-18; plan §7.15). Optional:
# without Sable none of that code loads.
[[dependencies.${mod_id}]]
    modId        = "sable"
    type         = "optional"
    versionRange = "[2.0.5,)"
    ordering     = "NONE"
    side         = "BOTH"
