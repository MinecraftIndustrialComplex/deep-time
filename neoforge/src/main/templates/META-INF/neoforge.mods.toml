modLoader   = "javafml"
loaderVersion = "${loader_version_range}"
license     = "${mod_license}"

[[mixins]]
config = "deeptime.mixins.json"

# Test-only mixins; the config plugin applies them only with -Ddeeptime.gametest=true.
[[mixins]]
config = "deeptime.gametest.mixins.json"

[[mods]]
modId       = "${mod_id}"
version     = "${mod_version}"
displayName = "${mod_name}"
authors     = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
    modId        = "minecraft"
    type         = "required"
    versionRange = "${minecraft_version_range}"
    ordering     = "NONE"
    side         = "BOTH"

[[dependencies.${mod_id}]]
    modId        = "neoforge"
    type         = "required"
    versionRange = "${neo_version_range}"
    ordering     = "NONE"
    side         = "BOTH"

# The planet wraps east-west through Toroidal World's API (decisions file, "Wrapping").
[[dependencies.${mod_id}]]
    modId        = "toroidal_world"
    type         = "required"
    versionRange = "[0.19.3,)"
    ordering     = "AFTER"
    side         = "BOTH"

# Sable ships get the pole cap's wind (compat/sable/SablePoleCap, P1-18; plan §7.15). Optional:
# without Sable none of that code loads.
[[dependencies.${mod_id}]]
    modId        = "sable"
    type         = "optional"
    versionRange = "[2.0.5,)"
    ordering     = "NONE"
    side         = "BOTH"

# Distant Horizons: its far terrain comes from Deep Time's world data (compat/dh, P3-04; plan §10.5).
# Optional, and any version loads: the API is bound by name at run time (3.3.0's merged names and
# the published names of 3.3.1+ were checked), and a version it cannot bind is left to generate
# its own LODs.
[[dependencies.${mod_id}]]
    modId        = "distanthorizons"
    type         = "optional"
    versionRange = "[0,)"
    ordering     = "NONE"
    side         = "BOTH"

# Create Ore Excavation and Create: Diesel Generators: veins and oil come from Deep Time's sites
# (mixin/compat/createoreexcavation, mixin/compat/createdieselgenerators; P1-16, plan §7.14).
# Optional: the mixins apply only when the mod is installed. The ranges start at the versions whose
# signatures were checked (COE 1.6.8, CDG 1.21.1-1.3.15); a later one that drifts fails the boot.
[[dependencies.${mod_id}]]
    modId        = "createoreexcavation"
    type         = "optional"
    versionRange = "[1.6.8,)"
    ordering     = "NONE"
    side         = "BOTH"

[[dependencies.${mod_id}]]
    modId        = "createdieselgenerators"
    type         = "optional"
    versionRange = "[1.21.1-1.3.15,)"
    ordering     = "NONE"
    side         = "BOTH"
