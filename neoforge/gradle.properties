## Gradle
org.gradle.jvmargs = -Xmx2G
org.gradle.daemon = true
org.gradle.parallel = true
org.gradle.caching = true

## Minecraft / NeoForge -- the same pins as mic-climate and the MIC pack (pack.toml
## pins NeoForge 21.1.249). Toroidal World 0.19.3 needs [21.1.248,).
minecraft_version       = 1.21.1
minecraft_version_range = [1.21.1, 1.22)
neo_version             = 21.1.249
neo_version_range       = [21.1.248,)
loader_version_range    = [4,)

parchment_minecraft_version = 1.21.1
parchment_mappings_version  = 2024.11.17

## Mod
mod_id          = deeptime
mod_name        = Deep Time
# Must equal the Cargo [workspace.package] version; `checkVersions` fails the build otherwise.
mod_version     = 0.0.1
mod_group_id    = com.minecraftindustrialcomplex
mod_authors     = Benjamin McIntyre
mod_license     = LGPL-3.0-or-later
mod_description = Simulates a planet's geologic history and plays it: tectonics, erosion, climate, strata and ore deposits on a wrapped world

## Dependencies -- Modrinth version ids (checked 2026-09-28; plan §4.3)
# Toroidal World 0.19.3+mc1.21.1 (MIT). The Modrinth file is a *bundle*: a lowcodefml
# jar carrying the NeoForge and Fabric builds as jar-in-jar. The NeoForge build (mod id
# toroidal_world, API com.toroidalworld.api.v1) is META-INF/jarjar/toroidal_world-
# neoforge-0.19.3+mc1.21.1.jar inside it, and itself nests MixinSquared. So Gradle
# compiles against the extracted inner jar, and every run loads the whole bundle from
# its mods/ folder, exactly as a player installs it.
# Licence by release: 0.19.3's jar declares MIT (checked 2026-10-16). The project, now
# "Exotic Worlds (Toroidal World)", is PolyForm Shield 1.0.0 from 1.0.0 on (Modrinth and
# its repo's LICENSE): an upgrade means treating it like Sable (compileOnly, never in our jar).
tw_version       = 8YTSYi9y
tw_inner_jar     = toroidal_world-neoforge-0.19.3+mc1.21.1.jar
# Sable 2.0.5+mc1.21.1 (PolyForm Shield 1.0.0: its API is called, never vendored or shipped).
# compileOnly, for compat/sable/ only (SableTestOps for the tests, SablePoleCap for the pole cap's
# wind when Sable is present). Its math types
# (BoundingBox3i, Pose3d) live in the nested companion jar, which Gradle extracts for javac.
sable_version    = U678xqle
sable_companion_jar = sable-companion-common-1.21.1-1.6.0.jar
# Excavated Variants 4.3.1 for NeoForge 1.21.1 (LGPL-3.0-or-later; Modrinth version id, slug
# excavated_variants): compileOnly for compat/ev/EvBridgeImpl (P1-15). Keep equal to the ev profile.
ev_version       = krUiU6UD
# Create Ore Excavation 1.21.1-1.6.8 (MIT; slug create-ore-excavation, file createoreexcavation-1.21-1.6.8.jar)
# and Create: Diesel Generators 1.21.1-1.3.15 (MIT; slug create-diesel-generators): compileOnly for the
# COE/CDG hooks (P1-16). Keep equal to the MIC pack's pins (pack/mods/create-ore-excavation.pw.toml,
# create-diesel-generators.pw.toml); the hooks' signatures were checked with javap on those jars.
coe_version      = tivxiPTo
cdg_version      = UoPH8lO1
# Create 6.0.10 for NeoForge 1.21.1 (code MIT, assets all rights reserved; Modrinth version id, slug create,
# file create-1.21.1-6.0.10.jar): compileOnly for compat/create/wrap, the wrap engine's Create adapters
# (docs/design/wrap-engine.md "Create across turning seams"). Keep equal to the MIC pack's pin
# (pack/mods/create.pw.toml). Its API types reach into the jars it nests (Ponder's catnip, Flywheel,
# Registrate), which Gradle extracts for javac. Never on a run's classpath: -PwithMic loads the mic set.
create_version   = UjX6dr61
create_nested_jars = flywheel-neoforge-1.21.1-1.0.6.jar,ponder-neoforge-1.0.82+mc1.21.1.jar,Registrate-MC1.21-1.3.0+67.jar
# TerraBlender 4.1.0.8 for NeoForge 1.21.1 (LGPL-3.0; Modrinth version id, slug terrablender): compileOnly
# for compat/terrablender and its mixin (P1-10). Keep equal to the terrablender profile.
terrablender_version = 6e8GCrLb
# Distant Horizons (LGPL-3.0; slug distanthorizons; P3-04). Never compiled against or shipped: compat/dh
# binds the API by name, and DhApiBindingTest opens these jars to prove it. dh_version follows
# the MIC pack's pin (pack/mods/distanthorizons.pw.toml: 3.3.3-1.21.1, API 7.2.0, since pack 62dd14e;
# before it 3.3.1 since pack 57561c9; the 3.3.0 before that renamed every NeoForge class
# <Class>_neoforge, the API included). dh_next_version is the newest release checked: 3.3.3 is also the
# newest published on 2026-10-22, so it equals the pin today and the dh-next smoke profile repeats dh;
# set it to a newer release when DH publishes one. dh_prev_version is the previous pin (3.3.1-1.21.1,
# API 7.1.0), kept so DhApiBindingTest still proves the binding on the older API.
dh_version       = 9w34y8ai
dh_next_version  = 9w34y8ai
dh_prev_version  = IcOcoekl

# JUnit (test-only; never shipped)
junit_version = 5.14.4
