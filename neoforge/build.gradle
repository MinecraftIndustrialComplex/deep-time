plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.74'
}

version = mod_version
group   = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def repoRoot = rootProject.projectDir.parentFile

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

// ---------------------------------------------------------------------------
// Toroidal World: resolve the bundle once, unpack the NeoForge build for compiling.
// ---------------------------------------------------------------------------
configurations {
    twBundle {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}
dependencies {
    twBundle "maven.modrinth:toroidal-world:${tw_version}"
}

def twInnerDir = layout.buildDirectory.dir('toroidal-world')
def extractToroidalWorld = tasks.register('extractToroidalWorld', Copy) {
    description = "Unpacks Toroidal World's NeoForge jar (the API) from the Modrinth bundle."
    from({ zipTree(configurations.twBundle.singleFile) }) {
        include "META-INF/jarjar/${tw_inner_jar}"
        eachFile { it.path = it.name }
        includeEmptyDirs = false
    }
    into twInnerDir
}

dependencies {
    compileOnly files(twInnerDir.map { it.file(tw_inner_jar) }).builtBy(extractToroidalWorld)

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // The game's own lz4-java, named explicitly so the test classpath does not depend on
    // how ModDevGradle exposes Minecraft's libraries (plan §4.3).
    testImplementation 'org.lz4:lz4-java:1.8.0'
}

// ---------------------------------------------------------------------------
// The gametest source set: resources only (templates, the test datapack). It joins
// the mod in dev runs but never the jar.
// ---------------------------------------------------------------------------
sourceSets {
    // Default dirs: src/gametest/resources (no Java).
    gametest {
        java.srcDirs = []
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        // Every game directory sits at the repository root, next to the scripts that
        // clean it (plan §4.3).
        client {
            client()
            gameDirectory = file('../run')
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = file('../run')
        }
        // ./gametest.sh -- the headless GameTest server; namespace `deeptime`.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'deeptime'
            systemProperty 'deeptime.gametest', 'true'
            jvmArgument '-Xmx6G'
            if (project.hasProperty('gametestDebugLog')) logLevel = org.slf4j.event.Level.DEBUG
            gameDirectory = file('../run-gametest')
        }
        // ./gametest-planet.sh -- a dev dedicated server with a real Deep Time + TW
        // overworld; namespace `deeptime_planet` (plan §9.4).
        planetServer {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enableGameTest', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'deeptime_planet'
            systemProperty 'deeptime.gametest', 'true'
            // Set by tools/planet/run_planet.py (--test-terrain); blank means world data.
            systemProperty 'deeptime.testTerrain', System.getenv('DEEPTIME_TEST_TERRAIN') ?: ''
            jvmArgument '-Xmx6G'
            gameDirectory = file('../run-planet')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }
}

// ---------------------------------------------------------------------------
// Runtime mods by folder (plan §4.3). Every run loads Toroidal World's bundle plus the
// jars of one server set from its mods/ folder. linkRunMods empties the folder of what
// it put there before, then links the run's set, skipping any jar whose mod id is
// already on the classpath and failing on a duplicate mod id.
// ---------------------------------------------------------------------------
def serverSetFor = { String run ->
    if (project.hasProperty('withMic')) return 'mic'
    if (run == 'gameTestServer') {
        if (project.hasProperty('withTerraBlender')) return 'terrablender'
        if (project.hasProperty('withEv')) return 'ev'
        return null
    }
    if (run == 'planetServer') return 'standalone'
    return null
}

def modIdsOf = { File jar ->
    def ids = []
    try {
        def zip = new java.util.zip.ZipFile(jar)
        try {
            def entry = zip.getEntry('META-INF/neoforge.mods.toml')
            if (entry != null) {
                zip.getInputStream(entry).text.eachLine { line ->
                    def m = line =~ /^\s*modId\s*=\s*"([^"]+)"/
                    if (m.find()) ids << m.group(1)
                }
            }
        } finally { zip.close() }
    } catch (Exception ignored) {}
    // The first modId under [[mods]] is the mod; later ones are dependency entries,
    // which only appear inside [[dependencies.*]] blocks with a different indent/key.
    return ids.isEmpty() ? [] : [ids[0]]
}

['gameTestServer', 'planetServer', 'client', 'server'].each { runName ->
    def cap = runName.capitalize()
    def gameDir = runName == 'gameTestServer' ? file('../run-gametest')
                : runName == 'planetServer' ? file('../run-planet') : file('../run')
    def linkTask = tasks.register("linkRunMods${cap}") {
        description = "Links Toroidal World and the run's server set into ${gameDir}/mods."
        dependsOn configurations.twBundle
        doLast {
            def modsDir = new File(gameDir, 'mods')
            modsDir.mkdirs()
            modsDir.listFiles().each { f ->
                if (java.nio.file.Files.isSymbolicLink(f.toPath())) f.delete()
            }
            def jars = [configurations.twBundle.singleFile]
            def set = serverSetFor(runName)
            if (set != null) {
                def setMods = new File(repoRoot, "smoke/${set}/server/mods")
                if (!setMods.isDirectory())
                    throw new GradleException("Server set '${set}' is not installed: run tools/smoke/install.sh ${set}")
                jars += setMods.listFiles().findAll { it.name.endsWith('.jar') }.sort { it.name }
            }
            def onClasspath = ['deeptime', 'toroidal_world_bundle', 'toroidal_world'] as Set
            def seen = [:]
            jars.each { jar ->
                def ids = modIdsOf(jar)
                def id = ids ? ids[0] : null
                if (jar != configurations.twBundle.singleFile && id in onClasspath) {
                    logger.lifecycle("linkRunMods: skipping ${jar.name} (${id} is provided by the build)")
                    return
                }
                if (id != null && seen.containsKey(id))
                    throw new GradleException("Two jars declare mod id '${id}': ${seen[id]} and ${jar.name}")
                if (id != null) seen[id] = jar.name
                java.nio.file.Files.createSymbolicLink(new File(modsDir, jar.name).toPath(), jar.toPath())
            }
            logger.lifecycle("linkRunMods: ${seen.size()} mod jars linked into ${modsDir} (set: ${set ?: 'none'})")
        }
    }
    tasks.matching { it.name == "run${cap}" }.configureEach { dependsOn linkTask }
}

// ---------------------------------------------------------------------------
// One version source: the Cargo workspace (plan §6.5).
// ---------------------------------------------------------------------------
def cargoToml = new File(repoRoot, 'Cargo.toml')
def checkVersions = tasks.register('checkVersions') {
    description = 'Fails when mod_version differs from the Cargo workspace version.'
    inputs.file cargoToml
    inputs.property 'modVersion', mod_version
    doLast {
        def text = cargoToml.text
        def section = text.substring(text.indexOf('[workspace.package]'))
        def m = section =~ /(?m)^version\s*=\s*"([^"]+)"/
        if (!m.find()) throw new GradleException("No version in [workspace.package] of ${cargoToml}")
        if (m.group(1) != mod_version)
            throw new GradleException("mod_version ${mod_version} != Cargo workspace version ${m.group(1)}")
    }
}
tasks.named('check') { dependsOn checkVersions }
tasks.named('build') { dependsOn checkVersions }

// A `key = "value"` line inside one [section] of Cargo.toml: a line scan, the same one
// deeptime-format's build.rs does, so the two can never read different values.
def cargoTomlValue = { String section, String key ->
    def inSection = false
    for (line in cargoToml.readLines()*.trim()) {
        if (line.startsWith('[')) { inSection = (line == "[${section}]".toString()); continue }
        if (!inSection) continue
        def m = line =~ /^${key}\s*=\s*"([^"]*)"/
        if (m.find()) return m.group(1)
    }
    throw new GradleException("No ${key} in [${section}] of ${cargoToml}")
}
// The world-data format version has one source: Cargo.toml [workspace.metadata.deeptime].
def formatVersion = cargoTomlValue('workspace.metadata.deeptime', 'format_version')
def cargoVersion = cargoTomlValue('workspace.package', 'version')

// ---------------------------------------------------------------------------
// Natives in the jar (plan §4.3, §6.5). Dev builds pack the host library that
// hostNatives stages in ../target/natives-host/; nothing else is packed, so a leftover
// natives-dist/ never leaks into a dev jar.
// ---------------------------------------------------------------------------
def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def hostLibName = osName.startsWith('windows') ? 'deeptime_jni.dll'
                : (osName.startsWith('mac') || osName.contains('darwin')) ? 'libdeeptime_jni.dylib'
                : 'libdeeptime_jni.so'
def builtHostLib = new File(repoRoot, "target/release/${hostLibName}")
def nativesHostDir = new File(repoRoot, 'target/natives-host')

// Rust target triple -> platform key (plan §6.4).
def platformKeys = [
    'x86_64-unknown-linux-gnu'  : 'linux-x86_64-gnu',
    'aarch64-unknown-linux-gnu' : 'linux-aarch64-gnu',
    'x86_64-unknown-linux-musl' : 'linux-x86_64-musl',
    'aarch64-unknown-linux-musl': 'linux-aarch64-musl',
    'x86_64-pc-windows-msvc'    : 'windows-x86_64',
    'aarch64-pc-windows-msvc'   : 'windows-aarch64',
    'x86_64-apple-darwin'       : 'macos-x86_64',
    'aarch64-apple-darwin'      : 'macos-aarch64',
]

def cargoBuildJni = tasks.register('cargoBuildJni', Exec) {
    description = 'cargo build --release -p deeptime-jni (plain cargo: the dev shell locally, rustup in CI).'
    workingDir repoRoot
    commandLine 'cargo', 'build', '--release', '-p', 'deeptime-jni'
    // cargo keeps its own up-to-date state; running it when nothing changed takes a second.
    outputs.upToDateWhen { false }
}

def hostNatives = tasks.register('hostNatives') {
    description = 'Builds the host native library and stages it with natives.json in ../target/natives-host/.'
    dependsOn cargoBuildJni
    inputs.file builtHostLib
    inputs.property 'version', cargoVersion
    inputs.property 'formatVersion', formatVersion
    outputs.dir nativesHostDir
    doLast {
        def rustc = new ProcessBuilder('rustc', '-vV').redirectErrorStream(true).start()
        def rustcOut = rustc.inputStream.text
        if (rustc.waitFor() != 0) throw new GradleException("rustc -vV failed:\n${rustcOut}")
        def triple = rustcOut.readLines().find { it.startsWith('host: ') }?.substring(6)?.trim()
        def key = platformKeys[triple]
        if (key == null) throw new GradleException("Host target ${triple} has no platform key (plan §6.4)")

        nativesHostDir.deleteDir()
        def dest = new File(nativesHostDir, key)
        dest.mkdirs()
        def staged = new File(dest, hostLibName)
        java.nio.file.Files.copy(builtHostLib.toPath(), staged.toPath())

        def md = java.security.MessageDigest.getInstance('SHA-256')
        staged.withInputStream { s -> byte[] buf = new byte[65536]; int n; while ((n = s.read(buf)) > 0) md.update(buf, 0, n) }
        def sha = md.digest().encodeHex().toString()

        // glibc floor: the highest GLIBC_x.y version the library needs (gnu targets only).
        String floor = null
        if (triple.endsWith('-linux-gnu')) {
            def text = new String(staged.bytes, 'ISO-8859-1')
            def versions = (text =~ /GLIBC_(\d+)\.(\d+)(?:\.(\d+))?/).collect { m ->
                [m[1] as int, m[2] as int, (m[3] ?: '0') as int]
            }
            def max = versions.max { a, b -> a[0] <=> b[0] ?: a[1] <=> b[1] ?: a[2] <=> b[2] }
            if (max != null) floor = max[2] == 0 ? "${max[0]}.${max[1]}" : "${max[0]}.${max[1]}.${max[2]}"
        }

        // The natives.json schema of plan §6.5 (schema 1).
        def manifest = [
            schema        : 1,
            version       : cargoVersion,
            format_version: formatVersion,
            libraries     : [[
                platform   : key,
                file       : hostLibName,
                rust_target: triple,
                glibc_floor: floor,
                sha256     : sha,
                size       : staged.length(),
            ]],
        ]
        new File(nativesHostDir, 'natives.json').setText(
            groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest)) + '\n', 'UTF-8')
        logger.lifecycle("hostNatives: ${key} ${hostLibName} (${staged.length()} bytes, sha256 ${sha.substring(0, 12)}…)")
    }
}

tasks.named('processResources', ProcessResources) {
    if (project.hasProperty('release')) {
        // TODO(P0-08): release jars pack ../target/natives-dist/ (all eight libraries and its
        // natives.json, from `nix run .#natives` or the natives.yml artifacts) and check that
        // natives.json lists 8 libraries. Until then -Prelease fails rather than ship a dev jar.
        doFirst { throw new GradleException('-Prelease (natives-dist packing) arrives with P0-08') }
    } else {
        dependsOn hostNatives
        from(nativesHostDir) { into 'natives/deeptime' }
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
    dependsOn hostNatives
    // Every test class runs in its own JVM: a native library links at most once per JVM, and
    // several classes link it (plan §4.3).
    forkEvery = 1
    systemProperty 'deeptime.test.version', cargoVersion
    systemProperty 'deeptime.test.formatVersion', formatVersion
    testLogging { events 'passed', 'failed'; exceptionFormat 'full' }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
