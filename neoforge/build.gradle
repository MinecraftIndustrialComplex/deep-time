plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.74'
}

version = mod_version
group   = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def repoRoot = rootProject.projectDir.parentFile

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

// ---------------------------------------------------------------------------
// Toroidal World: resolve the bundle once, unpack the NeoForge build for compiling.
// ---------------------------------------------------------------------------
configurations {
    twBundle {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}
dependencies {
    twBundle "maven.modrinth:toroidal-world:${tw_version}"
}

def twInnerDir = layout.buildDirectory.dir('toroidal-world')
def extractToroidalWorld = tasks.register('extractToroidalWorld', Copy) {
    description = "Unpacks Toroidal World's NeoForge jar (the API) from the Modrinth bundle."
    from({ zipTree(configurations.twBundle.singleFile) }) {
        include "META-INF/jarjar/${tw_inner_jar}"
        eachFile { it.path = it.name }
        includeEmptyDirs = false
    }
    into twInnerDir
}

// ---------------------------------------------------------------------------
// Sable (PolyForm Shield): compileOnly, for compat/sable/ only (SableTestOps, the planet-server
// tests' helper; SablePoleCap, the pole cap's ship wind, called only when Sable is loaded). Never
// on a run's classpath (the planet server loads Sable
// from the standalone set's mods/ folder) and never in the jar. Its companion jar (math
// types used in the API's signatures) is nested, so it is extracted for javac.
// ---------------------------------------------------------------------------
configurations {
    sableJar {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}
dependencies {
    sableJar "maven.modrinth:sable:${sable_version}"
}
def sableCompanionDir = layout.buildDirectory.dir('sable')
def extractSableCompanion = tasks.register('extractSableCompanion', Copy) {
    description = "Unpacks Sable's companion jar (BoundingBox3i, Pose3d) from the Sable jar."
    from({ zipTree(configurations.sableJar.singleFile) }) {
        include "META-INF/jarjar/${sable_companion_jar}"
        eachFile { it.path = it.name }
        includeEmptyDirs = false
    }
    into sableCompanionDir
}

// ---------------------------------------------------------------------------
// Distant Horizons (LGPL-3.0; P3-04): never on a compile or run classpath. compat/dh binds its API
// by name at run time, because the API classes have two names (DhApiBinding); the two jars here
// are only opened by DhApiBindingTest, each in its own class loader, to prove the binding against
// the real class files: the MIC pack's pin and the newest version checked.
// ---------------------------------------------------------------------------
// One configuration per version: two versions of one module in one configuration resolve to one.
configurations {
    dhPinJar {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    dhNextJar {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}
dependencies {
    dhPinJar "maven.modrinth:distanthorizons:${dh_version}"
    dhNextJar "maven.modrinth:distanthorizons:${dh_next_version}"
}

dependencies {
    compileOnly files(twInnerDir.map { it.file(tw_inner_jar) }).builtBy(extractToroidalWorld)
    compileOnly("maven.modrinth:sable:${sable_version}") { transitive = false }
    compileOnly files(sableCompanionDir.map { it.file(sable_companion_jar) }).builtBy(extractSableCompanion)
    // Excavated Variants 4.3.1 (LGPL-3.0-or-later; P1-15): compileOnly for compat/ev/EvBridgeImpl, the
    // only class naming its API, loaded when EV is installed. -PwithEv runs load it from the ev
    // server set (tools/smoke/profiles/ev.txt). The Modrinth slug is excavated_variants.
    compileOnly("maven.modrinth:excavated_variants:${ev_version}") { transitive = false }
    // Create Ore Excavation 1.6.8 and Create: Diesel Generators 1.3.15 (both MIT; P1-16): compileOnly
    // for the compat hooks (mixin/compat/createoreexcavation, mixin/compat/createdieselgenerators and
    // compat/coe, compat/cdg's *AccessImpl), at the MIC pack's pins. Never on a run's classpath: the
    // -PwithMic runs load them from the mic server set.
    compileOnly("maven.modrinth:create-ore-excavation:${coe_version}") { transitive = false }
    compileOnly("maven.modrinth:create-diesel-generators:${cdg_version}") { transitive = false }
    // TerraBlender 4.1.0.8 (LGPL-3.0; P1-10): compileOnly for compat/terrablender (TerraBlenderRegions,
    // RegionTrees) and mixin/compat/terrablender. -PwithTerraBlender runs load it from the terrablender set.
    compileOnly("maven.modrinth:terrablender:${terrablender_version}") { transitive = false }

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // The game's own lz4-java, named explicitly so the test classpath does not depend on
    // how ModDevGradle exposes Minecraft's libraries (plan §4.3).
    testImplementation 'org.lz4:lz4-java:1.8.0'
    // Likewise Guava and Gson, which the world-data reader uses (the game's own versions).
    testImplementation 'com.google.guava:guava:32.1.2-jre'
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

// ---------------------------------------------------------------------------
// The gametest source set: resources only (templates, the test datapack). It joins
// the mod in dev runs but never the jar.
// ---------------------------------------------------------------------------
sourceSets {
    // Default dirs: src/gametest/resources (no Java).
    gametest {
        java.srcDirs = []
    }
}

// -Ddeeptime.extraDatapack=<folder> (P1-12, cold-read review 2 gap 29): -PextraDatapack=<folder>, or
// with -PwithMic the MIC rock-tag datapack next to the pack (…/mic/Docs/datapacks/deeptime-mic-rock-tags;
// tools/remote/mac.sh --pack syncs the Mac's copy). The mod honours it only with -Ddeeptime.gametest=true.
def micRockTags = [new File(repoRoot, '../../Docs/datapacks/deeptime-mic-rock-tags'),
                   new File('/home/greencheetah/Projects/mic/Docs/datapacks/deeptime-mic-rock-tags')]
        .find { new File(it, 'pack.mcmeta').isFile() }
def extraDatapack = project.findProperty('extraDatapack')
        ?: (project.hasProperty('withMic') ? micRockTags?.canonicalPath : null)
if (project.hasProperty('withMic') && !project.hasProperty('extraDatapack') && micRockTags == null)
    logger.warn("-PwithMic: no MIC rock-tag datapack at ${new File(repoRoot, '../../Docs/datapacks/deeptime-mic-rock-tags')} " +
            "(tools/remote/mac.sh --pack syncs it); the runs go without the rock tags")

// Each running server has its own folder (tools/remote/vm/admit.py gives a server job one, and
// gametest.sh / run_planet.py point these at it), so several runs, from one checkout too, never share
// a world, logs or mods/. Unset (outside admit.py): the folders at the repository root.
def gameTestDir = file(System.getenv('DEEPTIME_GAMETEST_DIR') ?: '../run-gametest')
def planetDir = file(System.getenv('DEEPTIME_PLANET_DIR') ?: '../run-planet')
// The launchers copy the server set's jars for their run (tools/smoke/instance.py snapshot-mods), so
// an install.sh refreshing smoke/<set> cannot change the jars under a running server.
def runModsFor = { String set ->
    def snap = System.getenv('DEEPTIME_RUN_MODS')
    return snap ? new File(snap) : new File(repoRoot, "smoke/${set}/server/mods")
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        // Every game directory sits at the repository root, next to the scripts that
        // clean it (plan §4.3).
        client {
            client()
            gameDirectory = file('../run')
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = file('../run')
        }
        // ./gametest.sh -- the headless GameTest server; namespace `deeptime`.
        gameTestServer {
            type = 'gameTestServer'
            // -PwrapSpike: the wrap-engine spike's tests only (namespace deeptime_wrapspike) and its
            // mixins (-Ddeeptime.wrapspike=true; docs/design/wrap-engine.md). Never in a normal run.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.hasProperty('wrapSpike') ? 'deeptime_wrapspike' : 'deeptime'
            if (project.hasProperty('wrapSpike')) systemProperty 'deeptime.wrapspike', 'true'
            systemProperty 'deeptime.gametest', 'true'
            if (extraDatapack) systemProperty 'deeptime.extraDatapack', extraDatapack.toString()
            // -PgametestOnly=<name>[,<name>…]: run only those tests (GameTestServerMixin).
            if (project.hasProperty('gametestOnly')) systemProperty 'deeptime.gametestOnly', project.property('gametestOnly').toString()
            // The 160-mod MIC set needs more heap than the default runtime.
            // (The OutOfMemoryError "in lakeHolds" of P1-12/P1-09 was the suite's scattered column
            // samples all resident at once; gametest/ChunkSampling bounds them per tick.)
            jvmArgument(project.hasProperty('withMic') ? '-Xmx8G' : '-Xmx6G')
            if (project.hasProperty('gametestDebugLog')) logLevel = org.slf4j.event.Level.DEBUG
            gameDirectory = gameTestDir
        }
        // ./gametest-planet.sh -- a dev dedicated server with a real Deep Time + TW
        // overworld; namespace `deeptime_planet` (plan §9.4), plus `deeptime` so the harness can
        // also run a GameTest-server test there by name (P1-18: worldinfochannelrequired).
        planetServer {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enableGameTest', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'deeptime_planet,deeptime'
            systemProperty 'deeptime.gametest', 'true'
            // Set by tools/planet/run_planet.py (--test-terrain); blank means world data.
            systemProperty 'deeptime.testTerrain', System.getenv('DEEPTIME_TEST_TERRAIN') ?: ''
            if (extraDatapack) systemProperty 'deeptime.extraDatapack', extraDatapack.toString()
            jvmArgument '-Xmx6G'
            gameDirectory = planetDir
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }
}

// ---------------------------------------------------------------------------
// Runtime mods by folder (plan §4.3). Every run loads Toroidal World's bundle plus the
// jars of one server set from its mods/ folder. linkRunMods empties the folder of what
// it put there before, then links the run's set, skipping any jar whose mod id is
// already on the classpath and failing on a duplicate mod id.
// ---------------------------------------------------------------------------
// -PrunSet=<set> links smoke/<set>/server/mods into whichever run starts (tools/client/ev-assets.sh:
// the ev-client set into the client, for Excavated Variants' generated textures).
def serverSetFor = { String run ->
    if (project.hasProperty('runSet')) return project.property('runSet').toString()
    if (project.hasProperty('withMic')) return 'mic'
    if (run == 'gameTestServer') {
        if (project.hasProperty('withTerraBlender')) return 'terrablender'
        if (project.hasProperty('withEv')) return 'ev'
        return null
    }
    if (run == 'planetServer') return 'standalone'
    return null
}

// The mod ids a jar declares: every modId inside a [[mods]] block of its neoforge.mods.toml
// (dependency blocks name other mods and are skipped).
def modIdsOf = { File jar ->
    def ids = []
    try {
        def zip = new java.util.zip.ZipFile(jar)
        try {
            def entry = zip.getEntry('META-INF/neoforge.mods.toml')
            if (entry != null) {
                def inMods = false
                zip.getInputStream(entry).text.eachLine { line ->
                    def t = line.trim()
                    if (t.startsWith('[[') || (t.startsWith('[') && !t.startsWith('[[')))
                        inMods = t.startsWith('[[mods]]')
                    def m = t =~ /^modId\s*=\s*"([^"]+)"/
                    if (inMods && m.find()) ids << m.group(1)
                }
            }
        } finally { zip.close() }
    } catch (Exception ignored) {}
    return ids
}

// Per-set GameTest-server exclusions (tools/smoke/profiles/<set>.gametest-excluded): glob matchers.
def gametestExcluded = { String set ->
    def f = set == null ? null : new File(repoRoot, "tools/smoke/profiles/${set}.gametest-excluded")
    if (f == null || !f.isFile()) return []
    def fs = java.nio.file.FileSystems.default
    f.readLines().collect { it.trim() }.findAll { it && !it.startsWith('#') }.collect { fs.getPathMatcher("glob:${it}") }
}

// Whether a run's mods include Distant Horizons (P3-04): the server set has its jar and the run does
// not leave it out. The run gets -Ddeeptime.dh.expected=<this>, and the far-terrain GameTests fail
// when it is true and Distant Horizons is not loaded, instead of passing without it.
def dhExpected = { String runName ->
    def set = serverSetFor(runName)
    def dir = set == null ? null : runModsFor(set)
    def jars = dir?.listFiles()?.findAll { it.name.endsWith('.jar') && it.name.toLowerCase(Locale.ROOT).startsWith('distanthorizons') } ?: []
    if (runName == 'gameTestServer') {
        def matchers = gametestExcluded(set)
        jars = jars.findAll { jar -> !matchers.any { it.matches(java.nio.file.Paths.get(jar.name)) } }
    }
    return !jars.isEmpty()
}

['gameTestServer', 'planetServer', 'client', 'server'].each { runName ->
    def cap = runName.capitalize()
    if (runName in ['gameTestServer', 'planetServer'])
        neoForge.runs.getByName(runName).systemProperty 'deeptime.dh.expected', dhExpected(runName).toString()
    def gameDir = runName == 'gameTestServer' ? gameTestDir
                : runName == 'planetServer' ? planetDir : file('../run')
    def linkTask = tasks.register("linkRunMods${cap}") {
        description = "Links Toroidal World and the run's server set into ${gameDir}/mods."
        dependsOn configurations.twBundle
        doLast {
            def modsDir = new File(gameDir, 'mods')
            modsDir.mkdirs()
            modsDir.listFiles().each { f ->
                if (java.nio.file.Files.isSymbolicLink(f.toPath())) f.delete()
            }
            def jars = [configurations.twBundle.singleFile]
            def set = serverSetFor(runName)
            if (set != null) {
                def setMods = runModsFor(set)
                if (!setMods.isDirectory())
                    throw new GradleException("Server set '${set}' is not installed: run tools/smoke/install.sh ${set}")
                def setJars = setMods.listFiles().findAll { it.name.endsWith('.jar') }.sort { it.name }
                if (setJars.isEmpty())
                    throw new GradleException("Server set '${set}' has no jars in ${setMods}: re-run tools/smoke/install.sh ${set}")
                jars += setJars
            }
            def onClasspath = ['deeptime', 'toroidal_world_bundle', 'toroidal_world'] as Set
            // Sinytra Connector cannot run in a dev run ("Could not determine clean minecraft artifact
            // path"), so dev runs leave it out together with the Fabric-only jars it would load. The
            // production-launched smoke servers (tools/smoke/run.py) keep the whole pack.
            // Fabric-only means a Fabric descriptor and no NeoForge one: a dual-loader jar (Distant
            // Horizons 3.3.x carries fabric.mod.json and Fabric API jars under META-INF/jars next to
            // META-INF/neoforge.mods.toml) is a NeoForge mod here and stays. Each jar left out is
            // logged with its reason.
            def devSkipped = []
            jars = jars.findAll { jar ->
                def z = new java.util.zip.ZipFile(jar)
                try {
                    def fabricOnly = z.getEntry('fabric.mod.json') != null && z.getEntry('META-INF/neoforge.mods.toml') == null
                    def connector = jar.name.startsWith('connector-')
                    if (connector) { devSkipped << "${jar.name} (Connector)"; return false }
                    if (fabricOnly) { devSkipped << "${jar.name} (Fabric-only)"; return false }
                    return true
                } finally { z.close() }
            }
            // ...and, to a fixed point, every jar that hard-requires a mod left out.
            def skippedIds = ['connector'] as Set
            def requires = { File jar ->
                def z = new java.util.zip.ZipFile(jar)
                try {
                    def e = z.getEntry('META-INF/neoforge.mods.toml')
                    if (e == null) return [] as Set
                    def req = [] as Set
                    def depId = null, required = false, inDep = false
                    def flush = { if (inDep && depId && required) req << depId }
                    z.getInputStream(e).text.eachLine { line ->
                        def t = line.trim()
                        if (t.startsWith('[')) { flush(); inDep = t.startsWith('[[dependencies'); depId = null; required = false }
                        def m = t =~ /^modId\s*=\s*"([^"]+)"/
                        if (m.find()) depId = m.group(1)
                        if (t ==~ /^type\s*=\s*"required".*/ || t ==~ /^mandatory\s*=\s*true.*/) required = true
                    }
                    flush()
                    return req
                } finally { z.close() }
            }
            def changed = true
            while (changed) {
                changed = false
                jars = jars.findAll { jar ->
                    def missing = requires(jar).intersect(skippedIds)
                    if (!missing.isEmpty()) {
                        devSkipped << "${jar.name} (requires ${missing.join(', ')})"
                        skippedIds.addAll(modIdsOf(jar))
                        changed = true
                        return false
                    }
                    return true
                }
            }
            // Per-set GameTest-server exclusions (tools/smoke/profiles/<set>.gametest-excluded).
            if (runName == 'gameTestServer') {
                def matchers = gametestExcluded(set)
                jars = jars.findAll { jar ->
                    if (matchers.any { it.matches(java.nio.file.Paths.get(jar.name)) }) {
                        devSkipped << "${jar.name} (${set}.gametest-excluded)"
                        return false
                    }
                    return true
                }
            }
            if (devSkipped)
                logger.lifecycle("linkRunMods: left out of this dev run: ${devSkipped.join(', ')}")
            logger.lifecycle("linkRunMods: Distant Horizons expected in this run: ${dhExpected(runName)}")
            def seen = [:]
            jars.each { jar ->
                def ids = modIdsOf(jar)
                def id = ids ? ids[0] : null
                if (jar != configurations.twBundle.singleFile && id in onClasspath) {
                    logger.lifecycle("linkRunMods: skipping ${jar.name} (${id} is provided by the build)")
                    return
                }
                if (id != null && seen.containsKey(id)) {
                    // FML loads one of two byte-identical jars (the MIC pack pins Ritchie's
                    // Projectile Library twice); two different jars for one mod id are a hard failure.
                    def first = seen[id]
                    if (java.util.Arrays.equals(first.bytes, jar.bytes)) {
                        logger.warn("linkRunMods: ${jar.name} is a byte-identical duplicate of ${first.name} (mod id ${id}); linking one")
                        return
                    }
                    throw new GradleException("Two different jars declare mod id '${id}': ${first.name} and ${jar.name}")
                }
                if (id != null) seen[id] = jar
                java.nio.file.Files.createSymbolicLink(new File(modsDir, jar.name).toPath(), jar.toPath())
            }
            logger.lifecycle("linkRunMods: ${seen.size()} mods linked into ${modsDir} (set: ${set ?: 'none'})")
        }
    }
    tasks.matching { it.name == "run${cap}" }.configureEach { dependsOn linkTask }
}

// ---------------------------------------------------------------------------
// One version source: the Cargo workspace (plan §6.5).
// ---------------------------------------------------------------------------
def cargoToml = new File(repoRoot, 'Cargo.toml')
def checkVersions = tasks.register('checkVersions') {
    description = 'Fails when mod_version differs from the Cargo workspace version.'
    inputs.file cargoToml
    inputs.property 'modVersion', mod_version
    doLast {
        def text = cargoToml.text
        def section = text.substring(text.indexOf('[workspace.package]'))
        def m = section =~ /(?m)^version\s*=\s*"([^"]+)"/
        if (!m.find()) throw new GradleException("No version in [workspace.package] of ${cargoToml}")
        if (m.group(1) != mod_version)
            throw new GradleException("mod_version ${mod_version} != Cargo workspace version ${m.group(1)}")
    }
}
tasks.named('check') { dependsOn checkVersions }
tasks.named('build') { dependsOn checkVersions }

// A `key = "value"` line inside one [section] of Cargo.toml: a line scan, the same one
// deeptime-format's build.rs does, so the two can never read different values.
def cargoTomlValue = { String section, String key ->
    def inSection = false
    for (line in cargoToml.readLines()*.trim()) {
        if (line.startsWith('[')) { inSection = (line == "[${section}]".toString()); continue }
        if (!inSection) continue
        def m = line =~ /^${key}\s*=\s*"([^"]*)"/
        if (m.find()) return m.group(1)
    }
    throw new GradleException("No ${key} in [${section}] of ${cargoToml}")
}
// The world-data format version has one source: Cargo.toml [workspace.metadata.deeptime].
def formatVersion = cargoTomlValue('workspace.metadata.deeptime', 'format_version')
def cargoVersion = cargoTomlValue('workspace.package', 'version')

// ---------------------------------------------------------------------------
// Natives in the jar (plan §4.3, §6.5). Dev builds pack the host library that
// hostNatives stages in ../target/natives-host/; nothing else is packed, so a leftover
// natives-dist/ never leaks into a dev jar.
// ---------------------------------------------------------------------------
def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def hostLibName = osName.startsWith('windows') ? 'deeptime_jni.dll'
                : (osName.startsWith('mac') || osName.contains('darwin')) ? 'libdeeptime_jni.dylib'
                : 'libdeeptime_jni.so'
def builtHostLib = new File(repoRoot, "target/release/${hostLibName}")
def nativesHostDir = new File(repoRoot, 'target/natives-host')

// Rust target triple -> platform key (plan §6.4).
def platformKeys = [
    'x86_64-unknown-linux-gnu'  : 'linux-x86_64-gnu',
    'aarch64-unknown-linux-gnu' : 'linux-aarch64-gnu',
    'x86_64-unknown-linux-musl' : 'linux-x86_64-musl',
    'aarch64-unknown-linux-musl': 'linux-aarch64-musl',
    'x86_64-pc-windows-msvc'    : 'windows-x86_64',
    'aarch64-pc-windows-msvc'   : 'windows-aarch64',
    'x86_64-apple-darwin'       : 'macos-x86_64',
    'aarch64-apple-darwin'      : 'macos-aarch64',
]

def cargoBuildJni = tasks.register('cargoBuildJni', Exec) {
    description = 'cargo build --release -p deeptime-jni (plain cargo: the dev shell locally, rustup in CI).'
    workingDir repoRoot
    commandLine 'cargo', 'build', '--release', '-p', 'deeptime-jni'
    // cargo keeps its own up-to-date state; running it when nothing changed takes a second.
    outputs.upToDateWhen { false }
}

def hostNatives = tasks.register('hostNatives') {
    description = 'Builds the host native library and stages it with natives.json in ../target/natives-host/.'
    dependsOn cargoBuildJni
    inputs.file builtHostLib
    inputs.property 'version', cargoVersion
    inputs.property 'formatVersion', formatVersion
    outputs.dir nativesHostDir
    doLast {
        def rustc = new ProcessBuilder('rustc', '-vV').redirectErrorStream(true).start()
        def rustcOut = rustc.inputStream.text
        if (rustc.waitFor() != 0) throw new GradleException("rustc -vV failed:\n${rustcOut}")
        def triple = rustcOut.readLines().find { it.startsWith('host: ') }?.substring(6)?.trim()
        def key = platformKeys[triple]
        if (key == null) throw new GradleException("Host target ${triple} has no platform key (plan §6.4)")

        nativesHostDir.deleteDir()
        def dest = new File(nativesHostDir, key)
        dest.mkdirs()
        def staged = new File(dest, hostLibName)
        java.nio.file.Files.copy(builtHostLib.toPath(), staged.toPath())

        def md = java.security.MessageDigest.getInstance('SHA-256')
        staged.withInputStream { s -> byte[] buf = new byte[65536]; int n; while ((n = s.read(buf)) > 0) md.update(buf, 0, n) }
        def sha = md.digest().encodeHex().toString()

        // glibc floor: the highest GLIBC_x.y version the library needs (gnu targets only).
        String floor = null
        if (triple.endsWith('-linux-gnu')) {
            def text = new String(staged.bytes, 'ISO-8859-1')
            def versions = (text =~ /GLIBC_(\d+)\.(\d+)(?:\.(\d+))?/).collect { m ->
                [m[1] as int, m[2] as int, (m[3] ?: '0') as int]
            }
            def max = versions.max { a, b -> a[0] <=> b[0] ?: a[1] <=> b[1] ?: a[2] <=> b[2] }
            if (max != null) floor = max[2] == 0 ? "${max[0]}.${max[1]}" : "${max[0]}.${max[1]}.${max[2]}"
        }

        // The natives.json schema of plan §6.5 (schema 1).
        def manifest = [
            schema        : 1,
            version       : cargoVersion,
            format_version: formatVersion,
            libraries     : [[
                platform   : key,
                file       : hostLibName,
                rust_target: triple,
                glibc_floor: floor,
                sha256     : sha,
                size       : staged.length(),
            ]],
        ]
        new File(nativesHostDir, 'natives.json').setText(
            groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest)) + '\n', 'UTF-8')
        logger.lifecycle("hostNatives: ${key} ${hostLibName} (${staged.length()} bytes, sha256 ${sha.substring(0, 12)}…)")
    }
}

// Release jars (-Prelease) pack ../target/natives-dist/ instead: all eight libraries and their
// natives.json, from `nix run .#natives` (tools/natives/build-natives.sh) or the natives-dist
// artifact of .github/workflows/natives.yml (plan §4.5, §6.5, P0-08).
def nativesDistDir = new File(repoRoot, 'target/natives-dist')
def checkReleaseNatives = tasks.register('checkReleaseNatives') {
    description = 'Fails unless ../target/natives-dist holds all eight natives and a matching natives.json.'
    inputs.files(fileTree(nativesDistDir))
    inputs.property 'version', cargoVersion
    inputs.property 'formatVersion', formatVersion
    doLast {
        def hint = 'build them with `nix run .#natives` (tools/natives/build-natives.sh) or download the ' +
                'natives-dist artifact of the natives.yml workflow into target/natives-dist/'
        def manifestFile = new File(nativesDistDir, 'natives.json')
        if (!manifestFile.isFile())
            throw new GradleException("-Prelease: ${manifestFile} is missing; ${hint}")
        def m = new groovy.json.JsonSlurper().parse(manifestFile, 'UTF-8')
        def problems = []
        if (m.schema != 1) problems << "schema is ${m.schema}, not 1"
        if (m.version != cargoVersion) problems << "version is ${m.version}, the Cargo workspace says ${cargoVersion}"
        if (m.format_version != formatVersion) problems << "format_version is ${m.format_version}, Cargo.toml says ${formatVersion}"
        def libs = (m.libraries ?: []) as List
        def listed = libs.collect { it.platform } as Set
        def expected = platformKeys.values() as Set
        if (libs.size() != expected.size() || listed != expected)
            problems << "it lists ${libs.size()} libraries (${listed.sort().join(', ')}); a release needs exactly these ${expected.size()}: ${expected.sort().join(', ')}"
        def packed = ['natives.json'] as Set
        libs.each { lib ->
            def f = new File(nativesDistDir, "${lib.platform}/${lib.file}")
            packed << "${lib.platform}/${lib.file}".toString()
            if (platformKeys[lib.rust_target] != lib.platform)
                problems << "${lib.platform}: rust_target ${lib.rust_target} does not belong to it"
            if (!f.isFile()) { problems << "${lib.platform}: ${f} is missing"; return }
            if (f.length() != lib.size) problems << "${lib.platform}: size ${f.length()}, natives.json says ${lib.size}"
            def md = java.security.MessageDigest.getInstance('SHA-256')
            f.withInputStream { s -> byte[] buf = new byte[65536]; int n; while ((n = s.read(buf)) > 0) md.update(buf, 0, n) }
            def sha = md.digest().encodeHex().toString()
            if (sha != lib.sha256) problems << "${lib.platform}: sha256 ${sha}, natives.json says ${lib.sha256}"
        }
        def extra = fileTree(nativesDistDir).files.collect { nativesDistDir.toPath().relativize(it.toPath()).toString().replace('\\', '/') }
                .findAll { !(it in packed) }
        if (extra) problems << "unlisted files: ${extra.sort().join(', ')}"
        if (problems)
            throw new GradleException("-Prelease: ${nativesDistDir} is not a complete release set:\n  - " +
                    problems.join('\n  - ') + "\n${hint}")
        logger.lifecycle("checkReleaseNatives: ${libs.size()} libraries, version ${m.version}, format ${m.format_version}")
    }
}

tasks.named('processResources', ProcessResources) {
    // The built-in presets (plan §5.1, P1-13): one source, compiled into the core with include_str!
    // and shipped here as deeptime/presets/<name>.json for Presets.builtin (no natives needed).
    from(new File(repoRoot, 'crates/deeptime-core/presets')) {
        include '*.json'
        into 'deeptime/presets'
    }
    // The colour ramps the core's keyframes, the viewer and the game share (plan §3.3, P1-11):
    // one file, read by screen/model/Ramps as deeptime/ramps.json. The editor's field catalogue
    // likewise (P1-20): screen/model/EditorFields reads deeptime/editor_fields.json, the browser
    // workbench (deeptime watch) the same file.
    from(new File(repoRoot, 'crates/deeptime-viewer/assets')) {
        include 'ramps.json'
        include 'editor_fields.json'
        into 'deeptime'
    }
    // The climate mapping's reference (plan §7.2, P1-09): the bake compiles it in with include_str!,
    // the game reads it as the default of a datapack resource a pack may override. placement.json
    // (which temperature and humidity band each Köppen class takes) is the same kind of file; the
    // server hands a pack's copy to the bake in the content bundle.
    from(new File(repoRoot, 'crates/deeptime-core/data/climate_mapping')) {
        include 'default.json'
        include 'placement.json'
        into 'data/deeptime/deeptime/climate_mapping'
    }
    if (project.hasProperty('release')) {
        dependsOn checkReleaseNatives
        from(nativesDistDir) { into 'natives/deeptime' }
    } else {
        dependsOn hostNatives
        from(nativesHostDir) { into 'natives/deeptime' }
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
    dependsOn hostNatives
    // Every test class runs in its own JVM: a native library links at most once per JVM, and
    // several classes link it (plan §4.3).
    forkEvery = 1
    systemProperty 'deeptime.test.version', cargoVersion
    systemProperty 'deeptime.test.formatVersion', formatVersion
    // DhApiBindingTest: "<Modrinth version id>=<jar>" per Distant Horizons jar (P3-04).
    inputs.files(configurations.dhPinJar, configurations.dhNextJar)
    doFirst {
        systemProperty 'deeptime.test.dhJars',
                ["pin-${dh_version}=${configurations.dhPinJar.singleFile.absolutePath}",
                 "next-${dh_next_version}=${configurations.dhNextJar.singleFile.absolutePath}"].join(File.pathSeparator)
    }
    testLogging { events 'passed', 'failed'; exceptionFormat 'full' }
}

// ---------------------------------------------------------------------------
// World-data fixtures for the JUnit parity tests (P0-09): `deeptime synth` at C = 1,024 writes
// build/test-worlds/{wrap1024,lake1024} and their sample dumps. Plain `cargo`, never
// `nix develop` (cold-read review 2, gap 15): the dev shell provides it locally, rustup in CI.
// ---------------------------------------------------------------------------
def testWorldsDir = layout.buildDirectory.dir('test-worlds')
def testWorldTasks = [wrap1024: 'wrap-test', lake1024: 'lake-test'].collect { name, kind ->
    tasks.register("testWorld${name.capitalize()}", Exec) {
        description = "Writes the ${kind} world-data fixture (C = 1024) with deeptime synth."
        inputs.files(fileTree(new File(repoRoot, 'crates')) { exclude '**/target/**' })
        inputs.files(new File(repoRoot, 'Cargo.toml'), new File(repoRoot, 'Cargo.lock'))
        def out = testWorldsDir.map { it.dir(name) }
        def samples = testWorldsDir.map { it.file("${name}-samples.json") }
        outputs.dir out
        outputs.file samples
        workingDir repoRoot
        doFirst { delete out }
        commandLine 'cargo', 'run', '--release', '--locked', '-p', 'deeptime-cli', '--',
                'synth', '--kind', kind, '--size', '1024',
                '--out', out.get().asFile.absolutePath,
                '--dump-samples', samples.get().asFile.absolutePath
    }
}
// P1-22: Rust's column evaluator on the lake fixture (its lake water columns and their banks),
// for ColumnParityTest.theLakeWorldIsEqual.
def lakeWorldParity = tasks.register('testWorldLake1024Parity', Exec) {
    description = "Writes Rust's column evaluator on 300 columns of the lake fixture (lake1024/parity/columns.json)."
    dependsOn 'testWorldLake1024'
    def world = testWorldsDir.map { it.dir('lake1024') }
    def fixture = testWorldsDir.map { it.file('lake1024/parity/columns.json') }
    outputs.file fixture
    workingDir repoRoot
    commandLine 'cargo', 'run', '--release', '--locked', '-p', 'deeptime-cli', '--',
            'parity', '--world-data', world.get().asFile.absolutePath, '--columns', '300'
}
// P1-15: a synthetic deposit world (sites, bodies, events and a terrain) and Rust's own reading of
// it (`deeptime dump-deposits`), for DepositDataParityTest.
def depositWorldRun = tasks.register('testWorldDeposits4kRun', Exec) {
    description = 'Writes the synthetic deposit world fixture (C = 4096) with deeptime run.'
    inputs.files(fileTree(new File(repoRoot, 'crates')) { exclude '**/target/**' })
    inputs.files(new File(repoRoot, 'Cargo.toml'), new File(repoRoot, 'Cargo.lock'))
    def out = testWorldsDir.map { it.dir('deposits4k') }
    outputs.dir out
    workingDir repoRoot
    doFirst { delete out }
    commandLine 'cargo', 'run', '--release', '--locked', '-p', 'deeptime-cli', '--',
            'run', '--preset', new File(repoRoot, 'crates/deeptime-core/tests/presets/deposits_world_4k.json').absolutePath,
            '--out', out.get().asFile.absolutePath
}
def depositWorldDump = tasks.register('testWorldDeposits4k', Exec) {
    description = "Dumps Rust's reading of the deposit world fixture (sites, index, bodies, events)."
    dependsOn depositWorldRun
    def world = testWorldsDir.map { it.dir('deposits4k') }
    def dump = testWorldsDir.map { it.file('deposits4k-samples.json') }
    inputs.dir world
    outputs.file dump
    workingDir repoRoot
    commandLine 'cargo', 'run', '--release', '--locked', '-p', 'deeptime-cli', '--',
            'dump-deposits', '--world', world.get().asFile.absolutePath, '--out', dump.get().asFile.absolutePath
}
// P1-08: a small real planet (every stage, baked: format 0.1) and Rust's column evaluator on 500 of
// its columns (`deeptime parity` -> planet4k/parity/columns.json), for ColumnParityTest and
// NativeLinkTest.sampleColumnIsTheParityFixture.
def planetWorldRun = tasks.register('testWorldPlanet4kRun', Exec) {
    description = 'Writes the real test planet (C = 4096, tests/presets/planet_world_4k.json) with deeptime run.'
    inputs.files(fileTree(new File(repoRoot, 'crates')) { exclude '**/target/**' })
    inputs.files(new File(repoRoot, 'Cargo.toml'), new File(repoRoot, 'Cargo.lock'))
    def out = testWorldsDir.map { it.dir('planet4k') }
    outputs.dir out
    workingDir repoRoot
    doFirst { delete out }
    commandLine 'cargo', 'run', '--release', '--locked', '-p', 'deeptime-cli', '--',
            'run', '--preset', new File(repoRoot, 'crates/deeptime-core/tests/presets/planet_world_4k.json').absolutePath,
            '--out', out.get().asFile.absolutePath
}
def planetWorldParity = tasks.register('testWorldPlanet4k', Exec) {
    description = "Writes Rust's column evaluator on 500 columns of the real test planet (parity/columns.json)."
    dependsOn planetWorldRun
    def world = testWorldsDir.map { it.dir('planet4k') }
    def fixture = testWorldsDir.map { it.file('planet4k/parity/columns.json') }
    outputs.file fixture
    // P1-25: `parity` also writes the climate API's evaluator (ClimateParityTest).
    outputs.file testWorldsDir.map { it.file('planet4k/parity/climate.json') }
    workingDir repoRoot
    commandLine 'cargo', 'run', '--release', '--locked', '-p', 'deeptime-cli', '--',
            'parity', '--world-data', world.get().asFile.absolutePath, '--columns', '500'
}
def testWorlds = tasks.register('testWorlds') {
    description = 'Writes every world-data fixture the JUnit tests read.'
    dependsOn testWorldTasks
    dependsOn depositWorldDump
    dependsOn planetWorldParity
    dependsOn lakeWorldParity
}
tasks.named('test', Test) {
    dependsOn testWorlds
    systemProperty 'deeptime.testWorlds', testWorldsDir.get().asFile.absolutePath
    systemProperty 'deeptime.repoRoot', repoRoot.absolutePath
}

