pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'deeptime'

// The internal developer map (devmap/, mod id deeptime_devmap): a separate jar compiled against
// Deep Time, never shipped in Deep Time's jar or the MIC pack. `./gradlew build test` builds and
// tests it with the mod.
include 'devmap'
project(':devmap').projectDir = file('../devmap')
