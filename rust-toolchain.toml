# rustup reads this in CI. The Nix dev shell pins the same channel through rust-overlay
# (flake.nix `rustChannel`), and `nix flake check` fails if the two differ. No `targets`
# here: CI jobs add only the targets they build; the dev shell carries all eight.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy", "rust-src"]
profile = "minimal"
