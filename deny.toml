# cargo-deny policy (plan §4.5). Deep Time is LGPL-3.0-or-later: nothing GPL or unlicensed may
# be linked in. A crate outside this list needs a decision recorded in the decisions file's log.

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    # Deep Time's own crates (cargo-deny checks workspace members too; GNU ids match exactly).
    "LGPL-3.0-or-later",
]
confidence-threshold = 0.9
# The allow-list is policy, not an inventory: licences no current crate uses stay allowed.
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # One JNI binding and one Rayon: two majors in the graph would mean two thread pools or two
    # incompatible JNIEnv wrappers.
    { name = "jni", deny-multiple-versions = true },
    { name = "rayon", deny-multiple-versions = true },
]

[advisories]
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
