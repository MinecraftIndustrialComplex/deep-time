[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# The one version: gradle.properties `mod_version` must equal it (Gradle task checkVersions).
version = "0.0.1"
edition = "2024"
# The highest MSRV among the pinned crates (kiddo 6.3.0).
rust-version = "1.89"
license = "LGPL-3.0-or-later"
publish = false
repository = "https://github.com/MinecraftIndustrialComplex/deep-time"

[workspace.metadata.deeptime]
# The world-data format version (plan §5.7.2). Mirrored by deeptime_format::FORMAT_VERSION and Java's
# FormatVersion.CURRENT (a test on each side fails on drift); read by
# Gradle (hostNatives / natives.json) and by tools/natives/build-natives.sh.
format_version = "0.5"

[workspace.dependencies]
deeptime-format = { path = "crates/deeptime-format" }
deeptime-core = { path = "crates/deeptime-core" }
deeptime-noddy = { path = "crates/deeptime-noddy" }
# The GPU compute path (docs/design/gpu-compute.md), behind deeptime-core's `gpu` feature.
deeptime-gpu = { path = "crates/deeptime-gpu" }
deeptime-viewer = { path = "crates/deeptime-viewer" }
# The JNI binding (plan §6.1); only deeptime-jni uses it. MIT OR Apache-2.0.
jni = "=0.22.4"
# Data parallelism inside native calls, one private pool per session (plan §6.2). MIT OR Apache-2.0.
rayon = "=1.12.0"
# Presets, manifests and the JSON that crosses JNI. MIT OR Apache-2.0.
serde_json = "1"

[profile.release]
# Keep unwinding: jni-rs' with_env catches panics only when they unwind (plan §6.3).
panic = "unwind"
lto = "thin"

[profile.ship]
# What ships and what the P1-17/P1-19 gate bench measures (decisions log 2026-10-18; plan §6.4):
# release plus fat LTO in one codegen unit. On full 16k at 100 Myr the baseline build was 1.03x
# faster than `release` by CPU time and the x86-64-v3 build 1.10x, with the same world files; the
# libraries are 22 % smaller, and it builds 2.6 to 4.5x slower (STATUS.md build log 2026-10-18, natives). Used by
# tools/natives/build-natives.sh and tools/natives/gate-bins.sh; everyday builds stay on `release`.
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.dev]
# The workspace's own crates at -O1 in dev and test builds (Ben, 2026-09-30): at -O0 the core's
# test suite took ~38 min on the Mac, because the simulation kernels live in deeptime-core itself.
# Debug assertions and overflow checks stay on.
opt-level = 1

[profile.dev.package."*"]
# Dependencies optimised even in dev builds; simulation kernels are unusable at -O0.
opt-level = 2
