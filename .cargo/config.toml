# Git dependencies (mic-viewer, a private repository over SSH) are fetched by the git command, not
# cargo's built-in client: the git command uses the SSH agent on the laptop, as mic-rtsim's
# .cargo/config.toml found, and on the test VM it follows the `url.<mirror>.insteadOf` rewrite that
# tools/remote/git-mirrors.sh sets there (decisions log 2026-10-21).
[net]
git-fetch-with-cli = true

# Per-target flags for the eight native builds (plan §6.4).

# rustc drops `cdylib` for musl unless the C runtime is dynamic (rust-lang/cargo#10143). The
# resulting .so needs libgcc_s on Alpine (rust-lang/rust#82521).
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]

# Sable needed codegen-units=2 on Intel macOS to avoid a rustc hang; copied as a precaution. It
# outranks the `ship` profile's codegen-units = 1 there (rustflags come after the profile's flags).
# The macOS install names (`@rpath/<file>` instead of the build machine's path) are set per
# library by deeptime-jni's and deeptime-cpuprobe's build.rs, so the two dylibs never share one.
[target.x86_64-apple-darwin]
rustflags = ["-C", "codegen-units=2"]
