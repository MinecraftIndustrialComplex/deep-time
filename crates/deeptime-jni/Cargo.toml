[package]
name = "deeptime-jni"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "deeptime_jni"
crate-type = ["cdylib", "rlib"]

[dependencies]
deeptime-core.workspace = true
deeptime-format.workspace = true
jni.workspace = true
rayon.workspace = true
serde_json.workspace = true

# The GPU compute path (docs/design/gpu-compute.md) on Linux and Windows, whose Vulkan and DX12
# drivers load at run time. Not on macOS yet: its natives are cross-built without Apple's SDK, and
# Metal links Apple's frameworks (Metal, QuartzCore, Foundation) at build time.
[target.'cfg(not(target_os = "macos"))'.dependencies]
deeptime-core = { workspace = true, features = ["gpu"] }
