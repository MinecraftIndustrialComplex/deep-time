[package]
name = "deeptime-quincuncial"
description = "PROTOTYPE (not shipped): the Peirce quincuncial world square, its seam gluing for Immersive Portals, and a world-data resampler onto it (docs/design/seamless-wrapping.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

# A prototype kept apart from the shipped crates: nothing in the mod, the core or the CLI depends
# on it. Its projection maths is meant to fold into deeptime_format::projection if Ben picks it.
[[bin]]
name = "deeptime-quincuncial"
path = "src/main.rs"

[dependencies]
deeptime-format.workspace = true
rayon.workspace = true
serde_json = "1.0.151"
clap = { version = "4.5", features = ["derive"] }
