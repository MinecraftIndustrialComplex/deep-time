[package]
name = "deeptime-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
deeptime-format.workspace = true
# Checkpoints: stage state serialised with postcard (plan §3.3, P1-01). MIT OR Apache-2.0.
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
crc32fast = "1.5.0"
rayon.workspace = true
serde_json.workspace = true
# L0 geometry (P1-02, plan §5.2 and §13): vectors and the k-d tree. Both MIT OR Apache-2.0.
glam = "0.33.11"
kiddo = { version = "6.3.0", default-features = false, features = ["multi-threaded"] }
