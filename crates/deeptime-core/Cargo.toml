[package]
name = "deeptime-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
deeptime-format.workspace = true
# The kinematic event engine behind folds and faults (P2-01): the reference the world data's
# column rule is checked against.
deeptime-noddy.workspace = true
# Checkpoints: stage state serialised with postcard (plan §3.3, P1-01). MIT OR Apache-2.0.
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
crc32fast = "1.5.0"
# Share codes: raw DEFLATE (plan §5.1, P1-13). MIT OR Apache-2.0 (miniz_oxide backend).
flate2 = "1.1.10"
rayon.workspace = true
serde_json.workspace = true
# L0 geometry (P1-02, plan §5.2 and §13): vectors and the k-d tree. Both MIT OR Apache-2.0.
glam = "0.33.11"
kiddo = { version = "6.3.0", default-features = false, features = ["multi-threaded"] }
# The deposit engine's recorded field history (P1-04): LZ4 block compression of packed frames,
# the codec the format crate already uses for tile packs. MIT.
lz4_flex = "0.14.0"
# Orographic precipitation (P1-05, plan §8.3 item 4): Smith & Barstad's transfer function is
# applied in Fourier space. MIT OR Apache-2.0.
rustfft = "6.4.1"
# The GPU compute path (docs/design/gpu-compute.md): kernels that mirror CPU passes, used when the
# session's compute mode and the machine allow. Off by default, so the core builds and tests
# without a GPU stack; the CLI and the natives (macOS aside, for now) turn it on.
deeptime-gpu = { workspace = true, optional = true }

# mimalloc (MIT) under the counting allocator (crate::alloc): the small blocks come from it where
# the platform's allocator was the default. Off by default and shipped nowhere: it did not beat the
# pair noise (STATUS build log 2026-10-20); the CLI and the natives expose it as their `mimalloc` feature.
mimalloc = { version = "=0.1.52", optional = true }
# Its static library gives mi_usable_size and mi_collect (declared in crate::alloc); `extended`
# would only add safe-looking bindings and the cty crate.
libmimalloc-sys = { version = "=0.1.49", optional = true }

[features]
gpu = ["dep:deeptime-gpu"]
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]
# Experiments and the loadable library: mimalloc 2 instead of 3; thread-local storage that a library
# the JVM loads later can use (initial-exec TLS needs static TLS space).
mimalloc-v2 = ["mimalloc", "libmimalloc-sys/v2"]
mimalloc-dyn-tls = ["mimalloc", "libmimalloc-sys/local_dynamic_tls"]
