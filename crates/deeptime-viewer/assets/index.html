<!doctype html>
<!-- SPDX-License-Identifier: LGPL-3.0-or-later -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root { --bg: #f7f7f5; --fg: #1d1d1b; --muted: #6b6b66; --panel: #ffffff; --line: #d9d9d4; --accent: #c0392b; --hl: #fff3c4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16171a; --fg: #e8e8e3; --muted: #9a9a94; --panel: #1f2024; --line: #33343a; --accent: #ff6b5b; --hl: #3a3420; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0 0 2px; }
  header .meta { color: var(--muted); font-size: 12px; }
  main, #timelapse { display: flex; flex-wrap: wrap; gap: 12px; padding: 12px 16px; }
  #mapwrap, #tlmain { flex: 1 1 640px; min-width: 0; }
  #map { width: 100%; aspect-ratio: 2 / 1; display: block; background: #000; cursor: crosshair; border: 1px solid var(--line); touch-action: none; }
  #kf { width: 100%; aspect-ratio: 2 / 1; display: block; background: #000; border: 1px solid var(--line); image-rendering: pixelated; }
  #controls, #tlcontrols { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; align-items: center; }
  #controls button, #tlcontrols button, #tlcontrols select { font: inherit; padding: 2px 8px; }
  #scrub { flex: 1 1 240px; }
  #tlabel { font-variant-numeric: tabular-nums; min-width: 22ch; }
  #strip { display: flex; gap: 4px; overflow-x: auto; margin-top: 8px; padding-bottom: 4px; }
  #strip figure { margin: 0; flex: 0 0 auto; cursor: pointer; border: 2px solid transparent; border-radius: 3px; }
  #strip figure.on { border-color: var(--accent); }
  #strip img { display: block; width: 96px; height: 48px; image-rendering: pixelated; }
  #strip figcaption { font-size: 11px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  aside { flex: 0 1 340px; min-width: 260px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; margin-bottom: 10px; }
  .panel h2 { font-size: 13px; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  #layers label { display: block; }
  #legend canvas { width: 100%; height: 14px; display: block; border: 1px solid var(--line); }
  #legend .ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  #kflegend { margin-top: 6px; font-size: 12px; color: var(--muted); }
  #kflegend .bar { height: 12px; border: 1px solid var(--line); }
  #kflegend .ends { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
  #kflegend .sw { display: inline-flex; align-items: center; gap: 3px; margin: 0 8px 2px 0; }
  #kflegend .sw i { display: inline-block; width: 12px; height: 12px; border: 1px solid var(--line); }
  table.kv { border-collapse: collapse; width: 100%; font-size: 13px; table-layout: fixed; }
  table.kv td { padding: 1px 4px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
  table.kv td:first-child { color: var(--muted); width: 36%; }
  #ticker, #sites { max-height: 320px; overflow-y: auto; font-size: 13px; }
  .row { padding: 2px 4px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; gap: 8px; }
  .row:hover { background: var(--hl); }
  .row.new { font-weight: 600; }
  .row .t { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 7ch; text-align: right; }
  a.ref { color: var(--accent); cursor: pointer; text-decoration: underline; }
  .hint { color: var(--muted); font-size: 12px; }
  #census { padding: 0 16px 16px; }
  #censusbody { overflow-x: auto; }
  table.census { border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
  table.census th, table.census td { padding: 2px 6px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  table.census th:first-child, table.census td:first-child { text-align: left; }
  table.census th { color: var(--muted); font-weight: 600; }
  svg.section { display: block; width: 100%; height: auto; margin-top: 6px; background: var(--bg); border: 1px solid var(--line); }
  svg.section text { font: 10px system-ui, sans-serif; fill: var(--muted); }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="meta" id="meta"></div>
</header>
<main id="layerview">
  <div id="mapwrap">
    <canvas id="map"></canvas>
    <div id="controls">
      <label><input type="checkbox" id="water" checked> water overlay</label>
      <label><input type="checkbox" id="seam" checked> seam marker</label>
      <label><input type="checkbox" id="grat"> graticule (30°)</label>
      <button id="fit">fit</button>
      <button id="toseam">centre on seam</button>
      <span class="hint">drag to pan (wraps east–west), wheel to zoom, click to inspect</span>
    </div>
  </div>
  <aside>
    <div class="panel"><h2>Layer</h2><div id="layers"></div></div>
    <div class="panel" id="legend"><h2>Legend</h2><canvas id="legendbar" width="256" height="14"></canvas><div class="ends"><span id="lmin"></span><span id="lunits"></span><span id="lmax"></span></div></div>
    <div class="panel" id="inspect"><h2>Inspect</h2><div id="inspectbody" class="hint">Click the map.</div></div>
  </aside>
</main>
<section id="timelapse" hidden>
  <div id="tlmain">
    <canvas id="kf"></canvas>
    <div id="tlcontrols">
      <button id="play" title="play / pause">▶</button>
      <input type="range" id="scrub" min="0" max="0" value="0" aria-label="keyframe">
      <span id="tlabel"></span>
      <select id="kflayer" aria-label="keyframe layer"></select>
      <label><input type="checkbox" id="markers" checked> events and sites</label>
    </div>
    <div id="kflegend"></div>
    <div id="strip"></div>
  </div>
  <aside>
    <div class="panel"><h2>Events up to this frame</h2><div id="ticker" class="hint">No events.</div></div>
    <div class="panel"><h2>Sites</h2><div id="sites" class="hint">No sites.</div></div>
    <div class="panel"><h2>Details</h2><div id="details" class="hint">Click an event or a site.</div></div>
  </aside>
</section>
<section id="census" hidden>
  <div class="panel"><h2>Deposit census</h2><div id="censusbody"></div></div>
</section>
<script src="bundle.js"></script>
<script src="report.js"></script>
<script src="viewer.js"></script>
</body>
</html>
