[package]
name = "deeptime-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "deeptime"
path = "src/main.rs"

[dependencies]
# The GPU compute path on (docs/design/gpu-compute.md): `--compute` picks the device.
deeptime-core = { workspace = true, features = ["gpu"] }
deeptime-format.workspace = true
deeptime-viewer.workspace = true
deeptime-tiles.workspace = true
mic-viewer.workspace = true
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0.151"

[features]
# mimalloc under the counting allocator (deeptime_core::alloc).
mimalloc = ["deeptime-core/mimalloc"]
mimalloc-v2 = ["deeptime-core/mimalloc-v2"]
